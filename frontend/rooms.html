<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Select Room</title>
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link rel="icon" href="img/icon.jpg" />
    <style>
      body {
        font-family: Poppins, system-ui;
        background: #eef3f8;
        margin: 0;
        padding: 0;
      }
      header {
        background: #004aad;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
      }
      .logo {
        height: 50px;
        border-radius: 8px;
        margin-right: 12px;
      }
      .title {
        font-size: 34px;
        margin: 0;
      }
      .room-container {
        max-width: 980px;
        margin: 40px auto;
        background: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
      }
      .rooms-box {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 24px;
      }
      .room-box {
        padding: 18px;
        border-radius: 14px;
        border: 2px solid #d7e1ec;
        background: #f9fbfc;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 8px;
        transition: all 0.18s;
      }
      .room-box:hover {
        transform: translateY(-6px);
        box-shadow: 0 10px 25px rgba(0, 74, 173, 0.08);
      }
      .room-selected {
        background: #004aad;
        color: #fff;
        border-color: #004aad;
        transform: scale(1.02);
      }
      .subtext {
        font-size: 14px;
        color: #555;
      }
      .price {
        font-weight: 700;
        margin-top: 6px;
      }
      .confirm {
        margin-top: 28px;
        text-align: center;
      }
      .confirm button {
        background: #004aad;
        color: #fff;
        padding: 14px 28px;
        border-radius: 12px;
        border: 0;
        font-size: 18px;
        cursor: pointer;
      }
      @media (max-width: 800px) {
        .rooms-box {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <img src="img/FullLogo.jpg" alt="MeetX Logo" class="logo" />
      <h1 class="title">MeetX</h1>
    </header>

    <section class="room-container">
      <h2>Select Your Meeting Room</h2>

      <div id="roomsBox" class="rooms-box">
        <!-- rooms injected here -->
        <div style="grid-column: 1/-1; color: #666">Loading rooms…</div>
      </div>

      <div class="confirm">
        <button onclick="confirmRoom()">Confirm →</button>
      </div>
    </section>

    <footer style="text-align: center; padding: 18px; color: #666">
      © 2025 MeetX
    </footer>

    <script>
      let selectedRoom = null;
      async function loadRooms() {
        const box = document.getElementById("roomsBox");
        box.innerHTML =
          '<div style="grid-column:1/-1;color:#666">Loading rooms…</div>';
        const res = await fetch("getRooms.php");
        if (!res.ok) {
          box.innerHTML =
            '<div style="grid-column:1/-1;color:#b00020">Unable to load rooms</div>';
          return;
        }
        const rooms = await res.json();
        if (!rooms.length) {
          box.innerHTML =
            '<div style="grid-column:1/-1;color:#666">No rooms found</div>';
          return;
        }
        box.innerHTML = "";
        rooms.forEach((r, idx) => {
          const el = document.createElement("div");
          el.className = "room-box";
          el.dataset.room = r.room_name;
          el.innerHTML = `<div style="font-size:18px;font-weight:700">${r.room_name}</div>
                        <div class="subtext">Capacity: ${r.capacity} people</div>
                        <div class="price">₹${r.rate_per_hour}/hr</div>`;
          el.onclick = () => {
            document
              .querySelectorAll(".room-box")
              .forEach((x) => x.classList.remove("room-selected"));
            el.classList.add("room-selected");
            selectedRoom = r.room_name;
          };
          box.appendChild(el);
        });
      }

      function confirmRoom() {
        if (!selectedRoom) {
          alert("Please select a room");
          return;
        }
        sessionStorage.setItem("room", selectedRoom);
        window.location.href = "summary.html";
      }

      loadRooms();
    </script>
  </body>
</html>
